<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZELUX-DL Link Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="header">
      <img class="brand-mark" src="icon48.png" alt="">
      <div class="brand-copy">
        <strong>ZELUX-DL</strong>
        <span>LINK CAPTURE</span>
      </div>
      <span class="version">2.3</span>
    </header>

    <section class="page-context" aria-labelledby="page-title">
      <div class="eyebrow">CURRENT TAB</div>
      <div class="page-title-row">
        <span class="site-indicator" aria-hidden="true"></span>
        <div class="page-copy">
          <strong id="page-title">Reading current page…</strong>
          <span id="page-host"></span>
        </div>
        <button id="scanBtn" class="quiet-button" type="button" title="Find downloadable links on this page">Scan</button>
      </div>
    </section>

    <section class="capture-section" aria-labelledby="links-label">
      <div class="section-heading">
        <label id="links-label" for="urlInput">Links to send</label>
        <span id="linkCount" class="count">0 links</span>
      </div>
      <textarea id="urlInput" rows="5" placeholder="Paste one or more URLs&#10;One link per line" autocomplete="off" spellcheck="false"></textarea>
      <div class="input-hint">Paste a link list, or scan this page to collect links.</div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText">Ready to capture links.</span>
    </div>

    <button id="sendBtn" class="primary-button" type="button" disabled>
      <span>Send to ZELUX-DL</span>
      <span class="button-arrow" aria-hidden="true">↗</span>
    </button>

    <footer>Runs locally through the ZELUX-DL protocol handler.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
