name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:windows
      - name: Sign Windows executable
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'zelux-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          ./scripts/sign-windows.ps1 -CertificatePath $certificatePath -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD
          Remove-Item -LiteralPath $certificatePath -Force
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          'q' | & .\dist\ZELUX-DL.exe | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "ZELUX-DL.exe exited with code $LASTEXITCODE"
          }
      - run: npm run build:linux
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: zelux-dl-${{ github.ref_name }}
          path: |
            dist/ZELUX-DL.exe
            dist/ZELUX-DL-linux
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ZELUX-DL.exe dist/ZELUX-DL-linux dist/SHA256SUMS.txt --generate-notes --verify-tag
